apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openshift-gitops
namePrefix: eqip-

resources:
- ../../../groups/all
- ../../../groups/eqip
# - ../../../groups/east
# - ../../../groups/non-prod

patches:
- path: patch-destination-server.yaml
  target:
    group: argoproj.io
    version: v1alpha1
    kind: Application

- path: patch-ocp-oauth-source.yaml
  target:
    group: argoproj.io
    version: v1alpha1
    kind: Application
    name: ocp-oauth
