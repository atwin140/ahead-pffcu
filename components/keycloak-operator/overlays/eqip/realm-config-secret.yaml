# Reference only — NOT included as a kustomize resource (do not commit real secrets to git).
# Create this directly on the eqip cluster before/after applying this overlay:
#
#   oc create secret generic eqip-keycloak-realm-config -n keycloak \
#     --from-literal=clientSecret='REPLACE_WITH_OIDC_CLIENT_SECRET' \
#     --from-literal=redirectUri='https://oauth-openshift.apps.eqip.DOMAIN/oauth2callback/keycloak' \
#     --from-literal=webOrigin='+' \
#     --dry-run=client -o yaml | oc apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: eqip-keycloak-realm-config
  namespace: keycloak
type: Opaque
stringData:
  clientSecret: CHANGE_ME
  redirectUri: https://oauth-openshift.apps.eqip.sharkbait.tech/oauth2callback/keycloak
  webOrigin: +
