apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: eqip-keycloak
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  host: keycloak.apps.eqip.sharkbait.tech
  to:
    kind: Service
    name: eqip-keycloak-service
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
