apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: keycloak

commonAnnotations:
  cluster.name: eqip
  cluster.role: workload

resources:
- ../../base
- storageclass-postgres-synology.yaml
- postgresql-secret.yaml
- postgresql.yaml
- keycloak.yaml
- keycloak-route.yaml
- keycloak-realm-openshift.yaml

commonLabels:
  app.kubernetes.io/part-of: keycloak-operator
  app.kubernetes.io/managed-by: argocd
