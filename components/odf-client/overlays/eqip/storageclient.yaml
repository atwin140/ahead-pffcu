apiVersion: ocs.openshift.io/v1alpha1
kind: StorageClient
metadata:
  name: ocs-storagecluster
  namespace: openshift-storage
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  # Reaches the ocs-provider-server NodePort exposed by the hub (acm.sharkbait.tech)
  # control-plane node acm-cp-01. Any hub node IP works since it's a NodePort Service,
  # but this one is pinned for a stable, reachable target from the eqip network.
  storageProviderEndpoint: "10.0.1.141:31659"
  # Onboarding credential auto-generated by the hub when the matching "eqip"
  # StorageConsumer was created there with spec.enable: false. Only used to
  # establish trust when this StorageClient is first created; once phase is
  # "Connected" the value is no longer re-validated. See README.md to
  # regenerate if this StorageClient ever needs to be recreated.
  onboardingTicket: eyJpZCI6ImVxaXAiLCJleHBpcmF0aW9uRGF0ZSI6IjE3ODk4Njc1NTMiLCJzdWJqZWN0Um9sZSI6Im9jcy1jbGllbnQiLCJzdG9yYWdlQ2x1c3RlciI6IiJ9.
